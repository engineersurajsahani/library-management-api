name: API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: sleep 10

      - name: Run API tests
        run: |
          npm run test:api:ci
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 4000

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: api-test-results
          path: test/results/
